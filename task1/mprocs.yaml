# Local dev stack for task1.
#
#   mprocs
#
# Both procs autostart. The backend runs on 3000, the frontend on 5173. The frontend talks to
# the backend over a hardcoded localhost URL, so nothing here needs configuring - start it and
# open http://localhost:5173.

procs:
  backend:
    shell: 'pnpm install && pnpm start:dev'
    cwd: backend
    autostart: true

  frontend:
    shell: 'pnpm install && pnpm dev'
    cwd: frontend
    autostart: true
