# Local dev stack for jurek-interview.
#
#   mprocs
#
# Nothing autostarts. Pick a proc with j/k and press `s` to start it, `x` to stop, `r` to restart.
# Each proc installs its own dependencies on the way up.
#
# Ports live in a private 471xx block - task-prs backend on 47101, its frontend on 47102,
# task-nasa backend on 47103, task-review backend on 47104 - so they never collide with the usual 3000/5173 crowd. Everything
# talks over hardcoded localhost URLs, so nothing here needs configuring.

procs:
  task-prs-backend:
    shell: 'pnpm install && pnpm start:dev'
    cwd: task-prs/backend
    autostart: false

  task-prs-frontend:
    shell: 'pnpm install && pnpm dev'
    cwd: task-prs/frontend
    autostart: false

  task-nasa-backend:
    shell: 'pnpm install && pnpm start:dev'
    cwd: task-nasa/backend
    autostart: false

  # One-shot, not a server. Start task-nasa-backend first, then press `s` here and watch it run;
  # it exits when the run is over, and `r` runs it again.
  task-nasa-storm:
    shell: 'node test-script/storm.mjs'
    cwd: task-nasa
    autostart: false

  task-review-backend:
    shell: 'pnpm install && pnpm start:dev'
    cwd: task-review/backend
    autostart: false
